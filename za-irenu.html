<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fde6f1">
<script src="assets/guard.js"></script>
<title>Za Irenu ♡</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 90'%3E%3Cpath d='M50 86 C20 62 4 46 4 27 C4 13 15 4 28 4 C38 4 46 10 50 18 C54 10 62 4 72 4 C85 4 96 13 96 27 C96 46 80 62 50 86Z' fill='%23ff5c9e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Fredoka:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
  /* Layout: the original love page — hero with a bouquet, the heart button with notes, reasons grid, flower fact */
  .hero-bloom { width: min(240px, 62vw); margin-top: 8px; animation: bob 5s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  .love { gap: 18px; }
  .heart-btn {
    border: 0; background: none; cursor: pointer; padding: 0;
    width: 120px; height: 110px; animation: beat 1.4s ease-in-out infinite; border-radius: 24px;
  }
  .heart-btn svg { width: 100%; height: 100%; }
  .note { font-size: 22px; font-weight: 500; min-height: 3.2em; max-width: 30ch; margin: 0; text-wrap: balance; transition: opacity .3s, transform .3s; }
  .note.swap { opacity: 0; transform: translateY(6px) scale(.98); }

  .reasons { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .reason {
    background: var(--card); border-radius: 24px; padding: 20px;
    border: 2px solid var(--line);
    display: flex; flex-direction: column; gap: 6px; min-width: 0;
    transition: transform .25s;
    animation: rise .7s cubic-bezier(.3, 1.3, .5, 1) both;
  }
  .reason:hover { transform: translateY(-4px) rotate(-1deg); }
  .reason .icon { width: 34px; height: 34px; }
  .reason b { font-weight: 600; font-size: 18px; }
  .reason span { color: var(--ink-soft); }
  @media (max-width: 460px) { .reasons { grid-template-columns: 1fr 1fr; gap: 10px; } .reason { padding: 16px 14px; border-radius: 20px; } .reason b { font-size: 16px; } .reason span { font-size: 15px; line-height: 1.4; } }

  .flower-fact { text-align: center; max-width: 52ch; margin: 0 auto; color: var(--ink-soft); text-wrap: balance; }
  .flower-fact b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="corner bl" aria-hidden="true" data-bloom="pink"></div>
<div class="corner br" aria-hidden="true" data-bloom="deep"></div>
<div class="corner tr" aria-hidden="true" data-bloom="light"></div>

<main>
  <section class="hero">
    <span class="eyebrow">✧ mali sajt samo za ✧</span>
    <h1>Irenu Knezevic</h1>
    <p class="sub">najljepsa cura na svijetu</p>
    <div class="hero-bloom" aria-hidden="true" data-bloom="mix"></div>
  </section>

  <section class="card love" aria-live="polite">
    <h2>Pritisni srce</h2>
    <button class="heart-btn" id="heart" aria-label="Prikazi poruku" data-heart></button>
    <p class="note" id="note">Ti si moja srecica.</p>
    <p class="hint">♡</p>
  </section>

  <section style="display:flex;flex-direction:column;gap:24px">
    <h2>Zasto si mi omiljena</h2>
    <div class="reasons" id="reasons"></div>
  </section>

  <p class="flower-fact">Hortenzije su svudje jer si ti moja <b>hortenzijica</b></p>

  <footer class="site">
    <small>pritisni bilo gdje za zvjezdice i srca ti si moje srce malo</small>
  </footer>
</main>
<nav class="tabbar" data-page="zatebe"></nav>

<script src="assets/site.js"></script>
<script>
(() => {
  const notes = [
    'Ti si moja srecica.',
    'Kidas kineski',
    'jedva cekam da te vidim',
    'Najljepsi osmijeh ikad',
    'imas dobre sise ',
    'ti si moja hortenzijica'
  ];
  let ni = 0;
  const note = K.$('note');
  K.$('heart').addEventListener('click', e => {
    ni = (ni + 1) % notes.length;
    note.classList.add('swap');
    setTimeout(() => { note.textContent = notes[ni]; note.classList.remove('swap'); }, K.reduce ? 0 : 250);
    K.burstAt(e.currentTarget, 28);
  });

  const heartIcon = c => `<svg class="icon" viewBox="0 0 100 90" aria-hidden="true"><path d="${K.HEART_D}" fill="${c}"/></svg>`;
  const starIcon = c => `<svg class="icon" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4 L62 38 L98 38 L69 59 L80 94 L50 73 L20 94 L31 59 L2 38 L38 38Z" fill="${c}"/></svg>`;
  const reasons = [
    [heartIcon('#ff8fbf'), 'Tvoj osmijeh', 'je jako lijep.'],
    [starIcon('#ffa6cf'), 'Tvoj sjaj', 'Strasno je kolko si lijepa plasim se aaaa'],
    [heartIcon('#e8559a'), 'Tvoja dobrota', 'je nenormalna'],
    [starIcon('#ff7fb3'), 'Tvoji zagrljaji', 'kidaju'],
    [heartIcon('#ffa6cf'), 'Tvoja sasavost', 'Pogotovo kad si pijana'],
    [starIcon('#f7a8d8'), 'Samo ti', 'i nasih 13 djece (i jos 13 usvojenih 4 kineza 3 crnca)'],
  ];
  K.$('reasons').innerHTML = reasons.map(([i, t, d], k) => `<div class="reason" style="animation-delay:${k * 70}ms">${i}<b>${t}</b><span>${d}</span></div>`).join('');
})();
</script>
</body>
</html>
